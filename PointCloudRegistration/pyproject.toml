[project]
name = "point-cloud-registration"
version = "0.1.0"
description = "Point cloud registration and fusion using ARKit and COLMAP data"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy (>=2.1.1,<3.0.0)",
    "open3d (>=0.19.0,<0.20.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
package-mode = false